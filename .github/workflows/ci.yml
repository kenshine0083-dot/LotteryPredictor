name: 统计核心 CI

# 只验证纯统计链路：零 TensorFlow、零 tkinter、零显示环境。
# 全量 GUI / 模型测试（test_pipeline.py，138 项）需要 TF 2.13 与本地显示环境，
# 留在本地运行；CI 不装那几百 MB，因此能跨 Python 版本且秒级出结果。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Python ${{ matrix.python-version }} · 核心统计
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是 TF 2.13 支持的上限；3.13 完全不受 TF 版本锁定，
        # 两者同时通过即证明核心链路已与模型环境解耦。
        python-version: ['3.11', '3.13']

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: 只安装轻量核心依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -c "import numpy, pandas, scipy, openpyxl; print('numpy', numpy.__version__, '| pandas', pandas.__version__, '| scipy', scipy.__version__)"

      - name: 确认未安装 TensorFlow（依赖分层守卫）
        run: |
          python -c "
          import importlib.util
          heavy = [m for m in ('tensorflow','keras','keras_tuner','sklearn') if importlib.util.find_spec(m)]
          print('已安装的重依赖:', heavy or '无')
          assert not heavy, 'CI 环境被污染，依赖分层失效'
          "

      - name: 确认公开数据、文档资产与图片齐全（含中文文件名）
        run: |
          test -f "历史数据.xlsx" && test -f audit_aggregate.json
          test -f config.json && test -f DATA_SOURCES.md
          test -f README.md && test -f README.en.md && test -f CHANGELOG.md
          test -f BUILD.md && test -f RELEASE_NOTES.md && test -f records_template.csv
          test -f audit_result.png && test -f kronos_migration/kronos_migration_result.png
          test -f combos.py && test -f main_lite.py && test -f build_exe.py
          test -f .pre-commit-config.yaml && test -f pre_commit_checks.py
          ls -l "历史数据.xlsx" audit_aggregate.json audit_result.png kronos_migration/kronos_migration_result.png

      - name: 全仓语法编译（含 GUI / 模型模块，只编译不导入）
        run: python -m compileall -q . -x '(^|/)(\.git|__pycache__|\.venv|tuner_dir|saved_state|picks|build|dist)(/|$)'

      - name: 项目自检钩子（私有文件 / 密钥 / 分层 / 文档资产）
        run: |
          python pre_commit_checks.py --json > precommit_result.json
          python -c "
          import json
          d = json.load(open('precommit_result.json', encoding='utf-8'))
          print('项目自检:', d['passed_count'], '/', d['total'], '通过')
          for i in d['items']:
              if not i['ok']:
                  print('  FAIL |', i['name'], '|', i['detail'])
          assert d['passed'], '项目自检失败'
          "

      - name: 统计核心测试（100 项）
        run: |
          python test_core.py --json > core_result.json
          python -c "
          import json
          d = json.load(open('core_result.json', encoding='utf-8'))
          print(f\"统计核心测试: {d['passed_count']}/{d['total']} 通过\")
          for i in d['items']:
              if not i['ok']:
                  print('  FAIL |', i['name'])
          assert d['passed'], '统计核心测试失败'
          "

      - name: 一键复现（61 项，核对 README 声明值、数据来源与玩法规格）
        run: |
          python reproduce.py --json > reproduce_result.json
          python -c "
          import json
          d = json.load(open('reproduce_result.json', encoding='utf-8'))
          print(f\"一键复现: {d['total']} 项, passed={d['passed']}\")
          for i in d['items']:
              if not i['ok']:
                  print(f\"  FAIL | {i['name']}: 重算 {i['actual']} vs 声明 {i['expected']}\")
          assert d['passed'], 'README 声明值与仓库数据不一致'
          "

      - name: 归档结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-py${{ matrix.python-version }}
          path: |
            core_result.json
            reproduce_result.json
            precommit_result.json
          if-no-files-found: warn
